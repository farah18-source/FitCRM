<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitCRM – Client Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header class="app-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <div class="brand-mark" aria-hidden="true">🏃‍♀️</div>
                <span class="brand-name">FitCRM</span>
            </a>
            <nav class="nav">
                <a href="new-client.html" class="nav-link">New Client</a>
                <a href="clients.html" class="nav-link">Client List</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <div style="margin-bottom: 24px;">
                <a href="clients.html" class="btn btn-ghost" style="margin-bottom: 16px;">← Back to Client List</a>
                <h1 class="section-title" id="clientName">Loading...</h1>
                <p class="section-subtitle">Client details and next session exercises</p>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label>Email</label>
                    <p id="clientEmail" style="margin: 8px 0 0 0; font-weight: 500;">-</p>
                </div>

                <div class="form-field">
                    <label>Phone</label>
                    <p id="clientPhone" style="margin: 8px 0 0 0; font-weight: 500;">-</p>
                </div>

                <div class="form-field">
                    <label>Fitness Goal</label>
                    <p id="clientGoal" style="margin: 8px 0 0 0; font-weight: 500;">-</p>
                </div>

                <div class="form-field">
                    <label>Membership Start Date</label>
                    <p id="clientStartDate" style="margin: 8px 0 0 0; font-weight: 500;">-</p>
                </div>
            </div>

            <div style="margin-top: 32px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h2 style="font-size: 1.25rem; font-weight: 600; margin: 0;">Training History</h2>
                    <button id="editClientBtn" class="btn btn-ghost" type="button">Edit Client</button>
                </div>
                <ul id="trainingHistory" style="list-style: disc; padding-left: 24px; color: #6b7280;">
                    <li>Loading...</li>
                </ul>
            </div>

            <div style="margin-top: 32px;">
                <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 12px;">Exercises for Next Session</h2>
                <ul id="exercisesList" style="list-style: decimal; padding-left: 24px; color: #6b7280;">
                    <li>Loading exercises...</li>
                </ul>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>© <span id="year"></span> FitCRM.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
