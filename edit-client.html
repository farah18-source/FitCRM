<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitCRM – Edit Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header class="app-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <div class="brand-mark" aria-hidden="true">🏃‍♀️</div>
                <span class="brand-name">FitCRM</span>
            </a>
            <nav class="nav">
                <a href="new-client.html" class="nav-link">New Client</a>
                <a href="clients.html" class="nav-link">Client List</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <div style="margin-bottom: 24px;">
                <a href="clients.html" class="btn btn-ghost" style="margin-bottom: 16px;">← Back to Client List</a>
                <h1 class="section-title">Edit Client</h1>
                <p class="section-subtitle">Update client details.</p>
            </div>

            <form class="form-grid" id="editClientForm" action="#" method="get" onsubmit="return false;">
                <div class="form-field">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Alex Johnson" required />
                </div>
                <div class="form-field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="16" max="100" placeholder="30" required />
                </div>
                <div class="form-field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" selected>Select…</option>
                        <option>Female</option>
                        <option>Male</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="alex@example.com" required />
                </div>
                <div class="form-field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567" pattern="[0-9\(\)\-\s\+]+"
                        required />
                </div>
                <div class="form-field">
                    <label for="goal">Fitness Goal</label>
                    <input list="goalOptions" id="goal" name="goal" placeholder="Weight Loss" />
                    <datalist id="goalOptions">
                        <option value="Weight Loss"></option>
                        <option value="Muscle Gain"></option>
                        <option value="General Fitness"></option>
                        <option value="Endurance"></option>
                        <option value="Mobility"></option>
                    </datalist>
                </div>
                <div class="form-field">
                    <label for="startDate">Membership Start Date</label>
                    <input type="date" id="startDate" name="startDate" />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="clients.html" class="btn btn-ghost">Cancel</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>© <span id="year"></span> FitCRM.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
